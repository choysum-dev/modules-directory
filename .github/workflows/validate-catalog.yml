name: Validate Catalog

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CHOYSUM_NPM_FETCH_TIMEOUT_SECONDS: "10"
      CHOYSUM_NPM_FETCH_MAX_RETRIES: "3"
      CHOYSUM_NPM_FETCH_BACKOFF_SECONDS: "1.0"
      CHOYSUM_BUILD_CONCURRENCY: "5"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check check-jsonschema

      - name: Validate pointer JSON files against schema
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(modules/*/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No catalog pointer JSON files found; skip schema validation."
            exit 0
          fi
          check-jsonschema --schemafile schemas/catalog-entry.schema.json "${files[@]}"

      - name: Validate catalog pointers and structure
        run: python scripts/validate_catalog.py

      - name: Validate catalog build generation
        run: python scripts/build_catalog.py