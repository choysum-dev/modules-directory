name: Build Catalog Registry

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CHOYSUM_NPM_FETCH_TIMEOUT_SECONDS: "10"
      CHOYSUM_NPM_FETCH_MAX_RETRIES: "3"
      CHOYSUM_NPM_FETCH_BACKOFF_SECONDS: "1.0"
      CHOYSUM_BUILD_CONCURRENCY: "5"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build catalog dist artifacts
        run: python scripts/build_catalog.py

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

      - name: Trigger Cloudflare Pages rebuild
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        env:
          CLOUDFLARE_PAGES_BUILD_HOOK_URL: ${{ secrets.CLOUDFLARE_PAGES_BUILD_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_PAGES_BUILD_HOOK_URL}" ]; then
            echo "::error::Missing secret CLOUDFLARE_PAGES_BUILD_HOOK_URL. Configure a Cloudflare Pages build hook URL to trigger scheduled rebuilds."
            exit 1
          fi

          curl --fail --show-error --silent \
            --request POST \
            "${CLOUDFLARE_PAGES_BUILD_HOOK_URL}"
