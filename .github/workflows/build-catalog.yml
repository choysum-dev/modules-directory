name: Build Catalog Registry

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CHOYSUM_NPM_FETCH_TIMEOUT_SECONDS: "10"
      CHOYSUM_NPM_FETCH_MAX_RETRIES: "3"
      CHOYSUM_NPM_FETCH_BACKOFF_SECONDS: "1.0"
      CHOYSUM_BUILD_CONCURRENCY: "5"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build catalog dist artifacts
        run: python scripts/build_catalog.py

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
